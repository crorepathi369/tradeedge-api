name: TradeEdge Daily Fetch

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  # 3:00 PM IST = 09:30 UTC
  # 5:30 PM IST = 12:00 UTC
  schedule:
    - cron: '30 9 * * 1-5'
    - cron: '0 12 * * 1-5'

  # Manual trigger from GitHub Actions UI (for testing)
  workflow_dispatch:
    inputs:
      days:
        description: 'Days of data to fetch (default 5)'
        required: false
        default: '5'
      symbols:
        description: 'Specific symbols (leave empty for all F&O)'
        required: false
        default: ''

# ── Job ───────────────────────────────────────────────────────────────────────
jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45        # kill job if it hangs beyond 45 min

    steps:

      # 1. Checkout main branch (has tradeedge_fetch.py + push_incr_data.py)
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0       # need full history to access data branch

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          pip install yfinance pandas requests

      # 4. Wake Render BEFORE fetch so it's warm by the time we need it
      - name: Wake Render (pre-fetch)
        run: |
          RENDER_URL="${{ secrets.RENDER_API_URL }}"
          if [ -z "$RENDER_URL" ]; then
            RENDER_URL="https://tradeedge-api.onrender.com"
          fi
          echo "Pinging Render to wake it up: $RENDER_URL"
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 40 "$RENDER_URL/" || echo "000")
            echo "  Attempt $i → HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "  ✓ Render is awake!"
              break
            fi
            echo "  Still waking... waiting 20s"
            sleep 20
          done

      # 5. *** KEY FIX *** Restore existing CSVs from data branch FIRST
      #    Without this, the runner starts with empty tradeedge_data/
      #    and --merge has nothing to append to → overwrites 730-day history!
      - name: Restore existing CSVs from data branch
        run: |
          echo "Fetching data branch..."
          git fetch origin data

          echo "Checking out existing CSVs into tradeedge_data/..."
          mkdir -p tradeedge_data

          # List all CSV and JSON files in data branch and restore them
          git ls-tree -r origin/data --name-only | grep -E '\.(csv|json)$' | while read filepath; do
            filename=$(basename "$filepath")
            git show origin/data:"$filepath" > "tradeedge_data/$filename"
          done

          CSV_COUNT=$(ls tradeedge_data/*.csv 2>/dev/null | wc -l | tr -d ' ')
          echo "✓ Restored $CSV_COUNT CSV files from data branch"
          echo "  Sample dates in RELIANCE.csv:"
          tail -3 tradeedge_data/RELIANCE.csv 2>/dev/null || echo "  (not found)"

      # 6. Backfill any thin CSVs (< 100 rows) with full 2-year history
      #    Covers symbols added after the initial fetch (e.g. LAURUSLABS, LICI, LODHA, MCX)
      #    Runs a full fetch (no --merge) only for those symbols, then normal incr fetch follows
      - name: Backfill thin CSVs
        run: |
          python3 -c "
import os, sys
from pathlib import Path
d = Path('./tradeedge_data')
EXCLUDE = {'LTIM'}
thin = []
for f in sorted(d.glob('*.csv')):
    if f.stem.upper() in EXCLUDE:
        continue
    try:
        rows = sum(1 for _ in open(f)) - 1
        if rows < 100:
            thin.append(f.stem)
    except:
        pass
print(' '.join(thin))
" > /tmp/thin_syms.txt
          THIN=$(cat /tmp/thin_syms.txt)
          if [ -z "$THIN" ]; then
            echo "✓ No thin CSVs found — all symbols have sufficient history"
          else
            echo "⚠ Thin CSVs detected (< 100 rows): $THIN"
            echo "Running full 2-year backfill for these symbols..."
            python tradeedge_fetch.py --symbols $THIN --outdir ./tradeedge_data --delay 1.2
            echo "✓ Backfill complete"
          fi

      # 7. Fetch incremental OHLC data from Yahoo Finance
      #    Now --merge appends to existing history instead of starting fresh
      - name: Fetch incremental data
        run: |
          DAYS="${{ github.event.inputs.days || '5' }}"
          SYMBOLS="${{ github.event.inputs.symbols }}"

          if [ -n "$SYMBOLS" ]; then
            echo "Fetching specific symbols: $SYMBOLS"
            python tradeedge_fetch.py --symbols $SYMBOLS --merge --days $DAYS --outdir ./tradeedge_data --delay 1.2
          else
            echo "Fetching full F&O universe — last $DAYS days"
            python tradeedge_fetch.py --fo --merge --days $DAYS --outdir ./tradeedge_data --delay 1.2
          fi

      # 8. Push updated CSVs to the data branch + auto-trigger Render pull
      - name: Push CSVs to data branch
        env:
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:         ${{ github.repository }}
          GITHUB_DATA_BRANCH:  data
          TRADEEDGE_DATA_DIR:  ./tradeedge_data
          RENDER_API_URL:      ${{ secrets.RENDER_API_URL }}
          FETCH_SECRET:        ${{ secrets.FETCH_SECRET }}
        run: |
          python push_incr_data.py --all

      # 9. Verify Render has the fresh data
      - name: Verify Render pull completed
        run: |
          RENDER_URL="${{ secrets.RENDER_API_URL }}"
          if [ -z "$RENDER_URL" ]; then
            RENDER_URL="https://tradeedge-api.onrender.com"
          fi
          echo "Waiting 15s for Render pull to complete..."
          sleep 15
          PULL=$(curl -s --max-time 20 "$RENDER_URL/pull-status" || echo "{}")
          echo "Pull status: $PULL"
          MANIFEST=$(curl -s --max-time 20 "$RENDER_URL/data/manifest" || echo "{}")
          COUNT=$(echo $MANIFEST | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('count',0))" 2>/dev/null || echo "unknown")
          echo "✓ Render has $COUNT CSVs ready to serve"
          echo "✓ TradeEdge is ready at: https://crorepathi369.github.io/tradeedge-api/"

      # 10. Summary
      - name: Print summary
        if: always()
        run: |
          echo "=== Data directory ==="
          ls tradeedge_data/*.csv 2>/dev/null | wc -l | xargs echo "CSV files:"
          echo "=== Last 5 modified ==="
          ls -lt tradeedge_data/*.csv 2>/dev/null | head -5
          echo "=== Sample — last 3 rows of RELIANCE.csv ==="
          tail -3 tradeedge_data/RELIANCE.csv 2>/dev/null || echo "(not found)"
          echo "=== Done! Open TradeEdge and click Load Cloud ==="
          echo "    https://crorepathi369.github.io/tradeedge-api/"
